<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Excel 到浏览器预览的处理链路</title>
  <desc id="desc">Excel 工作簿经由解析、动态计算和图表模型转换，在浏览器中呈现为表格和 ECharts 图表。</desc>
  <defs>
    <linearGradient id="excel" x1="0" x2="1"><stop stop-color="#107c41"/><stop offset="1" stop-color="#21a366"/></linearGradient>
    <linearGradient id="core" x1="0" x2="1"><stop stop-color="#315efb"/><stop offset="1" stop-color="#5b8cff"/></linearGradient>
    <linearGradient id="view" x1="0" x2="1"><stop stop-color="#7057d9"/><stop offset="1" stop-color="#a078e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#15324b" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7d92aa"/></marker>
  </defs>
  <rect width="1200" height="480" rx="24" fill="#f7f9fc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#17324d">从原生 Excel 到浏览器中的“可读、可算、可视”</text>
  <path d="M272 248H410M790 248H928" stroke="#7d92aa" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="58" y="136" width="214" height="225" rx="18" fill="url(#excel)"/>
    <rect x="80" y="164" width="172" height="126" rx="9" fill="#fff" opacity=".96"/>
    <path d="M81 198H251M81 232H251M124 165V290M167 165V290M210 165V290" stroke="#b7d9c7" stroke-width="2"/>
    <rect x="82" y="167" width="40" height="29" fill="#d8f1e2"/>
    <path d="M143 267l22-33 24 16 35-54" fill="none" stroke="#21a366" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="165" y="329" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#fff">原生 .xlsx</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="410" y="104" width="380" height="287" rx="18" fill="url(#core)"/>
    <text x="600" y="151" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#fff">@excel-preview/core</text>
    <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#21466e">
      <rect x="444" y="178" width="138" height="67" rx="10" fill="#fff"/>
      <text x="513" y="207" text-anchor="middle" font-weight="700">OOXML 解析</text><text x="513" y="230" text-anchor="middle">表格 / 样式 / 锚点</text>
      <rect x="618" y="178" width="138" height="67" rx="10" fill="#fff"/>
      <text x="687" y="207" text-anchor="middle" font-weight="700">动态计算</text><text x="687" y="230" text-anchor="middle">公式 / 跨表引用</text>
      <rect x="444" y="273" width="138" height="67" rx="10" fill="#fff"/>
      <text x="513" y="302" text-anchor="middle" font-weight="700">图表模型</text><text x="513" y="325" text-anchor="middle">类型 / 轴 / 系列</text>
      <rect x="618" y="273" width="138" height="67" rx="10" fill="#fff"/>
      <text x="687" y="302" text-anchor="middle" font-weight="700">回退策略</text><text x="687" y="325" text-anchor="middle">缓存值 / Canvas</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="928" y="136" width="214" height="225" rx="18" fill="url(#view)"/>
    <rect x="950" y="163" width="170" height="127" rx="9" fill="#fff"/>
    <path d="M951 197H1120M951 229H1055M951 260H1055M989 164V290M1026 164V290" stroke="#d7d1f5" stroke-width="2"/>
    <rect x="1062" y="184" width="42" height="91" rx="4" fill="#f6f4ff"/>
    <path d="M1070 262V232M1081 262V207M1092 262V219" stroke="#5b8cff" stroke-width="8" stroke-linecap="round"/>
    <path d="M1068 218l13-20 12 10" fill="none" stroke="#ed8f3a" stroke-width="3" stroke-linecap="round"/>
    <text x="1035" y="329" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#fff">浏览器预览</text>
  </g>
  <text x="165" y="405" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d7287">数据、公式、样式与图表</text>
  <text x="600" y="430" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d7287">结构化解析与渲染策略</text>
  <text x="1035" y="405" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5d7287">表格 + 图表 + 计算结果</text>
</svg>
